<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SteamSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #080808; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #2a2a2a; }

      @keyframes fadeIn { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(18px) scale(0.985); filter: blur(8px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
      @keyframes slideRight { from { opacity: 0; transform: translateX(18px) scale(0.99); filter: blur(8px); } to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); } }
      @keyframes popIn { from { opacity: 0; transform: scale(0.94); filter: blur(8px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }
      @keyframes shine { from { background-position: 180% 0; } to { background-position: -180% 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
